<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNIE AI Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --user-bubble-bg: #eff6ff;
            --user-bubble-border: #bfdbfe;
            --ai-bubble-bg: #ffffff;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background: var(--bg-white);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar - Chat History */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, width 0.3s ease;
        }

        .sidebar.collapsed {
            width: 0;
            overflow: hidden;
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--primary-blue-hover);
        }

        .history-section-title {
            padding: 12px 16px 4px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chat-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #e2e8f0;
        }

        .history-item.active {
            background: #dbeafe;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-light);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .dashboard-link:hover {
            text-decoration: underline;
        }

        /* Main Section */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
            position: relative;
        }

        .top-header {
            height: 56px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-white);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-sidebar-btn {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-sidebar-btn:hover {
            background: var(--bg-secondary);
        }

        .chat-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 100px 20px;
        }

        .chat-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome-box {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-box h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .welcome-box p {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .suggestion-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .suggestion-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13.5px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            background: #eff6ff;
        }

        /* Message Bubbles */
        .message-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .avatar.user {
            background: var(--primary-blue);
            color: white;
        }

        .avatar.ai {
            background: #dbeafe;
            color: var(--primary-blue);
            border: 1px solid #bfdbfe;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-row.user .message-content {
            background: var(--user-bubble-bg);
            color: var(--text-main);
            border: 1px solid var(--user-bubble-border);
            border-bottom-right-radius: 2px;
        }

        .message-row.ai .message-content {
            background: var(--ai-bubble-bg);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 2px;
        }

        /* Input Area at Bottom */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-white);
            border-top: 1px solid var(--border-light);
            padding: 16px 20px;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .text-input {
            flex: 1;
            min-height: 48px;
            max-height: 160px;
            padding: 12px 16px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-family: var(--font-family);
            font-size: 15px;
            outline: none;
            resize: none;
            background: var(--bg-white);
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .send-button {
            padding: 12px 20px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-button:hover {
            background: var(--primary-blue-hover);
        }

        .send-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Sidebar: Chat History -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                INNIE AI
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">
                + New Chat
            </button>
        </div>
        <div class="history-section-title">Chat History</div>
        <div class="chat-history-list" id="chatHistory"></div>
        <div class="sidebar-footer">
            <span>v0.0.1</span>
            <a href="/dashboard" class="dashboard-link">Dashboard</a>
        </div>
    </aside>

    <!-- Main Container -->
    <main class="main-container">
        <header class="top-header">
            <div class="header-left">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
                    ☰ History
                </button>
                <span class="chat-title">INNIE AI</span>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="chat-wrapper" id="chatWrapper">
                <div class="welcome-box" id="welcomeBox">
                    <h1>How can I help you today?</h1>
                    <p>Plain white & blue interface with multi-turn conversation and chat history.</p>

                    <div class="suggestion-buttons">
                        <button class="suggestion-btn" onclick="sendSuggestion('Hello, who are you?')">Hello, who are you?</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('What is a neural network?')">What is a neural network?</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Explain Python backpropagation')">Explain backpropagation</button>
                        <button class="suggestion-btn" onclick="sendSuggestion('Tell me a short joke')">Tell me a joke</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <textarea class="text-input" id="messageInput" placeholder="Type your message here..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                <button class="send-button" id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>

    <script>
        const API_URL = '/api/chat';
        let isGenerating = false;
        let currentChatId = null;

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function startNewChat() {
            currentChatId = null;
            location.reload();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();
            if (!text || isGenerating) return;

            const welcome = document.getElementById('welcomeBox');
            if (welcome) welcome.remove();

            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;
            isGenerating = true;

            const typingDiv = appendMessage('ai', 'Thinking...');
            scrollToBottom();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, max_tokens: 60, temperature: 0.8 })
                });
                const data = await response.json();

                typingDiv.remove();
                const aiText = data.reply || data.generated || data.response || 'No response returned.';
                appendMessage('ai', aiText);
            } catch (error) {
                typingDiv.remove();
                appendMessage('ai', '⚠️ Error connecting to server.');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                isGenerating = false;
                scrollToBottom();
            }
        }

        function sendSuggestion(text) {
            document.getElementById('messageInput').value = text;
            autoResize(document.getElementById('messageInput'));
            sendMessage();
        }

        function appendMessage(role, text) {
            const wrapper = document.getElementById('chatWrapper');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatarHtml = role === 'user'
                ? `<div class="avatar user">U</div>`
                : `<div class="avatar ai">AI</div>`;

            const contentHtml = `<div class="message-content">${escapeHtml(text)}</div>`;

            if (role === 'user') {
                row.innerHTML = contentHtml + avatarHtml;
            } else {
                row.innerHTML = avatarHtml + contentHtml;
            }

            wrapper.appendChild(row);
            scrollToBottom();
            return row;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
